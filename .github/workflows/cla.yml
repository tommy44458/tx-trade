name: CLA

# Contributors sign CLA.md once by commenting on their pull request. Signatures
# are stored on the separate `cla-signatures` branch, not on main. This workflow
# never checks out or runs pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event.comment.body == 'recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: tommy44458,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
